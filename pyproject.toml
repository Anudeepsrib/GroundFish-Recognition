[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb", ".venv*", "venv*"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "F401", "F841"]  # relaxed for initial YOLO11 upgrade; tighten later

[tool.ruff.per-file-ignores]
"*.ipynb" = ["ALL"]          # Notebooks are documentation + research; not production code
"tests/*" = ["E402"]         # Allow import order in tests

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"